name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/HardwareMonitor/HardwareMonitor.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained -o publish

      - name: Ensure resources.pri in publish output
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.pri -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "PRI_FOUND: $($_.FullName) ($($_.Length) bytes)" }
          if (-not (Test-Path "publish/resources.pri")) {
            $pri = Get-ChildItem -Path . -Recurse -Filter "resources.pri" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\publish\\' } | Select-Object -First 1
            if ($pri) { Copy-Item $pri.FullName "publish/resources.pri" -Force; Write-Host "COPIED_PRI from $($pri.FullName)" }
            else { Write-Warning "PRI_NOT_FOUND anywhere" }
          } else { Write-Host "resources.pri already in publish" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HardwareMonitor-win-x64
          path: publish/**
